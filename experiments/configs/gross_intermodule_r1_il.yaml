# Inter-module r=1 with the INTERLEAVED idle model (2026-08-18 audit fix).
# Identical to gross_intermodule_r1.yaml except lpu_interleaved_idle_depth: 12 — merged
# rounds charge each qubit as the paper's ~12-timestep interleaved deformed cycle would
# (k = 12 - active layers), instead of per serialized sub-cycle emission layer (measured
# 4.5x overcharge/round, 91% DEPOLARIZE1; the merge window held 64% of circuit noise).
# Fresh outdir: the serialized-model spectrum stays as the before/after reference.
label: gross_intermodule_r1_il
outdir: runs/framework/bb144/inter_module_r1_il
code_name: bb144
experiment: inter_module
decoder_name: relay
techniques: [IS, I]

p_ref: 0.005
p_lo: 1.0e-4
p_hi: 0.005
p_coupler_factor: 1
lpu_C: 10
lpu_d_init: 12
lpu_idle_noise: true
lpu_interleaved_idle_depth: 12
lpu_include_memory_obs: false
ansatz_model: f5
pin_onset: false

relay_num_sets: 20
relay_stop_nconv: 5

mw_single_sector: false
mw_use_symmetry: false
mw_max_trials: 500
mw_workers: 16

# weights_range provisional: the interleaved model REDUCES total noise mass, so the
# old [1,1674] cap is generous; re-freeze from a sizing probe before production.
weights_range: [1, 1674]
adaptive: true
adaptive_failures: 20
adaptive_shots_min: 4
adaptive_shots_max: 3000
adaptive_stop_zero_bins: 3
