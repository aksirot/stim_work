# LOW-WEIGHT TOP-UP of gross_intermodule_r1_il_fast_tdg (paper framing, campaign decoder).
# The 300-shot main run stops at 3 consecutive zero-failure bins, i.e. where f(w) drops
# below ~1/300. On the paper-framed circuit f(w) is only ~0.3-1% across the region that
# carries LER(1e-3) (r1: mean fault count 51, sampled frontier landed at w=62 -> the 1e-3
# mass was NOT covered). This config re-samples the low-weight window with 3000 shots per
# bin so bins with f ~ 1e-3 still register ~3 failures. Its own outdir; the notebook
# merges it with the main spectrum, preferring the higher-shot bin where both exist.
# Below ~w=30 (f < ~3e-4) even 3000 shots see nothing -- that tail is a fish job.
label: gross_intermodule_r1_il_fast_tdg_lo
outdir: runs/framework/bb144/inter_module_r1_il_fast_tdg_lo
code_name: bb144
experiment: inter_module
decoder_name: relay
techniques: [IS, I]

p_ref: 0.005
p_lo: 1.0e-4
p_hi: 0.005
p_coupler_factor: 1
lpu_C: 10
lpu_d_init: 0                  # <-- NO padding (paper framing); 12 in the production configs
lpu_noiseless_return: true     # <-- the final bare cycle is the paper's noise-free final cycle
lpu_idle_noise: true
lpu_interleaved_idle_depth: 12
lpu_include_memory_obs: true   # K=23: obs0 output + 22 memory (F_out/F_mem split)

relay_gamma0: 0.125
relay_pre_iter: 80
relay_num_sets: 20             # campaign relay (deep600 is 600; fish-only locally)
relay_set_max_iter: 60
relay_gamma_lo: -0.24
relay_gamma_hi: 0.66
relay_stop_nconv: 5

mw_single_sector: false        # K=23 mixes X-type obs0 + Z-type memory obs (full DEM)

weights_range: [40, 75]      # low-weight window only (main run covers the rest)
adaptive: true
adaptive_failures: 20
adaptive_shots_min: 4
adaptive_shots_max: 3000   # 10x the main run: resolves f ~ 1e-3 bins
adaptive_stop_zero_bins: 3
