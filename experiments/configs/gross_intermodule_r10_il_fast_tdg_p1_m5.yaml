# PAPER-FRAMED inter-module (r10) + ASYMMETRIC DEVICE NOISE: measurement flips x5 and
# measure/reset dead-time idle x5 (noise_scale_factors -> src/lpu_noise_scaling.scale_im_noise,
# the same function the MC driver used for the im_*_m5 cells). IS at p_ref=1e-3 with the
# decoder built on THIS scaled circuit (priors matched to the asymmetric model at 1e-3) --
# the same convention as the other three paper-framed models, so the four are comparable.
# weight_stride 2, 3000 shots/bin, plan sized for the extra measurement mass (~1.35x).
label: gross_intermodule_r10_il_fast_tdg_p1_m5
outdir: runs/framework/bb144/inter_module_r10_il_fast_tdg_p1_m5
code_name: bb144
experiment: inter_module
decoder_name: relay
techniques: [IS, I]

p_ref: 0.001                  # <-- matched to the p of interest (see header)
p_lo: 1.0e-4
p_hi: 0.005
p_coupler_factor: 10
lpu_C: 10
lpu_d_init: 0                  # <-- NO padding (paper framing); 12 in the production configs
lpu_noiseless_return: true     # <-- the final bare cycle is the paper's noise-free final cycle
lpu_idle_noise: true
lpu_interleaved_idle_depth: 12
lpu_include_memory_obs: true   # K=23: obs0 output + 22 memory (F_out/F_mem split)

relay_gamma0: 0.125
relay_pre_iter: 80
relay_num_sets: 20             # campaign relay (deep600 is 600; fish-only locally)
relay_set_max_iter: 60
relay_gamma_lo: -0.24
relay_gamma_hi: 0.66
relay_stop_nconv: 5

mw_single_sector: false        # K=23 mixes X-type obs0 + Z-type memory obs (full DEM)

weights_range: [1, 620]        # E[faults](1e-3)=104 (x1.58 vs symmetric) -> mu(5e-3)+4sigma=613 (validated)
adaptive: true
adaptive_failures: 20
adaptive_shots_min: 4
adaptive_shots_max: 3000   # resolves f ~ 1e-3 bins (main run at 300 stopped above the mass)
adaptive_stop_zero_bins: 3
weight_stride: 2               # every 2nd weight (stride-fill interpolates)
noise_scale_factors: {meas: 5.0, meas_idle: 5.0}   # <-- the x5 device point (see header)
