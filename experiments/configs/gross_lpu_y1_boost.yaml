# Wave-5 BOOST pass: Ybar_1 in-module joint-Pauli measurement on the gross code.
#
# Boost convention: NEW config, NEW seed, OWN outdir, pooled with the parent downstream via
# lambda_analysis.pool_spectra. Never an in-place edit — run_is_sweep's guard
# (experiment_runner.py:642) aborts on a weights_plan/seed change against a live checkpoint, and
# resolved_outdir keys off `experiment`, so `outdir` MUST be explicit.
#
# WHAT CHANGES vs gross_lpu_y1.yaml:
#   seed 42 -> 43                    independent draws for additive pooling
#   adaptive_shots_max 3e3 -> 1e5    zero-bin floor 3/3000=1e-3 -> 3/1e5=3.0e-5
#   stride stays 6, weights_range stays [1,1110]  -> every boost bin pools onto a parent bin
#
# SIZING: this circuit's fitted onset is w0 = 25, where the parent log measured 0.531 s/shot at
# 8 threads — far cheaper than the automorphism's onset at w=69 (2.24 s/shot), because decode cost
# climbs with fault weight and Y1 starts failing early. At 8 cores: 1e5 shots = ~17.2 h for the
# worst bin, ~4.9 d for the whole run (the longest of the three).
#
# The cap was 1e6 while this targeted a SLURM cluster, where run_is_sweep's per-WEIGHT checkpoint
# (no intra-bin save) means a bin that cannot finish inside one walltime never lands. rodan turned
# out to have NO scheduler and to be a SHARED 96-core box, so the binding constraint is now
# politeness (8 cores/job x 3 = 25% of the box) and caps were cut 10x.
#
# Technique II stays dropped: a single BP-OSD decode on this 212k-column full DEM runs ~1.5-2 h
# (the parent smoke stalled at L(D) trial 6/50 after 10 h). The paper made the same call — Table 2
# has no Y1 row. w0 here is the fitted onset, not a pinned one (pin_onset: false).
#
# adaptive_stop_zero_bins stays 3 — REQUIRED: it terminates the descending sweep, which a higher
# cap pushes deeper. Note the parent run already reached w=7 with only 1 weight skipped, so this
# pass mostly deepens bins it already visited rather than finding new ones.
label: gross_lpu_y1_boost
code_name: bb144
experiment: joint_pauli
decoder_name: relay
techniques: [IS, I]
outdir: runs/framework/bb144/joint_pauli_boost
seed: 43

p_ref: 0.005
p_lo: 1.0e-4
p_hi: 0.005
lpu_C: 10
lpu_d_init: 12
lpu_operators: "Y1"
lpu_idle_noise: true
lpu_include_memory_obs: true
ansatz_model: f5
pin_onset: false

relay_num_sets: 20
relay_stop_nconv: 5

weights_range: [1, 1110]
weight_stride: 6
adaptive: true
adaptive_failures: 20
adaptive_shots_min: 4
adaptive_shots_max: 100000
adaptive_stop_zero_bins: 3
