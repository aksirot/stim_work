# Inter-module joint X̄₁(A)⊗X̄₁(B), symmetric couplers, TOUR DE GROSS FRAMING.
# Same circuit/noise/decoder as gross_intermodule_r1_il_fast.yaml EXCEPT the framing:
# the paper's per-instruction convention (arXiv:2506.03094 Sec. 2.6) — "the system
# begins in an error-free code state prior to the logical operation, and a final cycle
# of noise-free stabilizer measurements are performed at the end". So: NO memory
# padding (lpu_d_init: 0 -> the C=10 merged rounds follow the noiseless encoding round
# directly) and the single bare return cycle is noise-free (lpu_noiseless_return). The
# transversal readout is noiseless in every framing.
# Purpose (2026-09-22): the direct comparison with the paper's Table 2 number, gross
# inter-module measurement LER = 10^-2.7 (~2e-3) at p=1e-3, and the resolution of the
# padding question — the padded d_init=12 circuit is dominated by 24 idle rounds that
# the paper's number does not contain. Consumed by lpu_direct_mc.py (op im_r1_fast_tdg).
# Remaining known differences from the paper: decoder (campaign num_sets=20 here vs the
# paper's relay-BP; deep600 is the paper-grade one), and failure definition (ours = obs0
# + 22 Z-visible memory logicals; the paper counts any logical action).
label: gross_intermodule_r1_il_fast_tdg
outdir: runs/framework/bb144/inter_module_r1_il_fast_tdg
code_name: bb144
experiment: inter_module
decoder_name: relay
techniques: [IS, I]

p_ref: 0.005
p_lo: 1.0e-4
p_hi: 0.005
p_coupler_factor: 1
lpu_C: 10
lpu_d_init: 0                  # <-- NO padding (paper framing); 12 in the production configs
lpu_noiseless_return: true     # <-- the final bare cycle is the paper's noise-free final cycle
lpu_idle_noise: true
lpu_interleaved_idle_depth: 12
lpu_include_memory_obs: true   # K=23: obs0 output + 22 memory (F_out/F_mem split)

relay_gamma0: 0.125
relay_pre_iter: 80
relay_num_sets: 20             # campaign relay (deep600 is 600; fish-only locally)
relay_set_max_iter: 60
relay_gamma_lo: -0.24
relay_gamma_hi: 0.66
relay_stop_nconv: 5

mw_single_sector: false        # K=23 mixes X-type obs0 + Z-type memory obs (full DEM)

weights_range: [1, 340]        # IS plan: E[faults](5e-3) ~ 255 (129809 mechanisms), +4 sigma ~ 320; 340 covers p_hi
adaptive: true
adaptive_failures: 20
adaptive_shots_min: 4
adaptive_shots_max: 300
adaptive_stop_zero_bins: 3
