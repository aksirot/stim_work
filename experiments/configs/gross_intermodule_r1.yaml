# Wave 6: gross-to-gross INTER-MODULE joint measurement of X̄₁(A)⊗X̄₁(B) via the Tour de Gross
# code-code adapter (arXiv:2506.03094). Two [[144,12,12]] modules (A frame 0, B frame 378) each run
# the X̄₁ half-LPU augmented with their 11 bridge qubits, Bell-coupled by the adapter (11 bridge
# identification checks + 10 cross-module U_B checks). Benchmarked op = X̄₁⊗X̄₁ (the paper's choice).
#
# l-COUPLER / BELL-PAIR RATE: p_coupler = p_coupler_factor * p_ref. This file is r=1 — the
# paper-faithful "all connections equally faulty" baseline (Bell-coupler = gate rate). The r=10
# sibling (gross_intermodule_r10.yaml) is the paper's flagged "couplers ~10x worse" case. An INTEGER
# ratio keeps every coupler mechanism an exact integer multiple of q_base=p/15, so the single-
# parameter Technique-I expansion stays exact.
#
# Technique II dropped (as for Y1/automorphism): compute_distance is unreliable on these deformed
# non-CSS circuits (returns a spurious distance=1 — the validated Y1 circuit does too), so onset comes
# from the IS first-failure weight. shortest_graphlike_error gives d_circ<=10.
# NOTE: lpu_include_memory_obs is false until the K=23 merged-graph observable recipe lands.
# NOTE: weights_range is the idle-ON sizing probe (mu(5e-3) with idle noise on); freeze before launch.
label: gross_intermodule_r1
# EXPLICIT outdir: without it BOTH legs default to runs/framework/bb144/inter_module
# (resolved_outdir uses the EXPERIMENT name, and both legs share experiment: inter_module),
# so the two jobs race for one checkpoint and whichever loses aborts on the
# weights_plan guard — r1 [1,1674] vs r10 [1,1742] can never agree.
outdir: runs/framework/bb144/inter_module_r1
code_name: bb144
experiment: inter_module
decoder_name: relay
techniques: [IS, I]

p_ref: 0.005
p_lo: 1.0e-4
p_hi: 0.005
p_coupler_factor: 1
lpu_C: 10
lpu_d_init: 12
lpu_idle_noise: true
lpu_include_memory_obs: false
ansatz_model: f5
pin_onset: false

relay_num_sets: 20
relay_stop_nconv: 5

mw_single_sector: false
mw_use_symmetry: false
mw_max_trials: 500
mw_workers: 16

weights_range: [1, 1674]    # FROZEN 2026-07-27 from the idle-ON sizing probe at the production
                            # geometry (C=10, d_init=12, idle_noise=true, p_coupler_factor=1):
                            # N_expanded=4542083, q_base=3.34e-4 -> mu(1e-4)=30.4, mu(5e-3)=1517.6,
                            # w_hi = ceil(mu_max + 4*sqrt(mu_max)) = 1674. The old [1,900]
                            # PLACEHOLDER stopped short of the p_hi mass at w~1518.
weight_stride: 6
adaptive: true
adaptive_failures: 20
adaptive_shots_min: 4
adaptive_shots_max: 3000
adaptive_stop_zero_bins: 3
