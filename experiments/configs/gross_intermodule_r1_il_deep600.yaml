# Inter-module joint X̄₁(A)⊗X̄₁(B) measurement — SYMMETRIC couplers (p_coupler = p_ref),
# interleaved idle model, deep600 decoder. 2026-08-31 IS-vs-MC + coupler-sensitivity study.
# The r10 sibling (gross_intermodule_r10_il_deep600.yaml) sets p_coupler_factor: 10 for the
# "Bell-pair fidelity 10x worse" case; ONE idle convention (interleaved) across both so the
# r1-vs-r10 comparison is not confounded by the 4.5x serialized-idle artifact.
# deep600 = the validated best gross-code relay (campaign gammas + 600 legs; the published-
# gamma transcription is a trap — see intermodule_decoder_ab.py). Config default relay IS
# deep600, so the num_sets:20 override is deliberately absent.
label: gross_intermodule_r1_il_deep600
outdir: runs/framework/bb144/inter_module_r1_il_deep600
code_name: bb144
experiment: inter_module
decoder_name: relay
techniques: [IS, I]

p_ref: 0.005
p_lo: 1.0e-4
p_hi: 0.005
p_coupler_factor: 1
lpu_C: 10
lpu_d_init: 12
lpu_idle_noise: true
lpu_interleaved_idle_depth: 12
lpu_include_memory_obs: true   # K=23: obs0 output + 22 memory (F_out/F_mem split)
ansatz_model: f5
pin_onset: false

relay_gamma0: 0.125
relay_pre_iter: 80
relay_num_sets: 600
relay_set_max_iter: 60
relay_gamma_lo: -0.24
relay_gamma_hi: 0.66
relay_stop_nconv: 6

# FULL both-sector DEM is MANDATORY here: K=23 mixes obs0 (X-type) with 22 memory
# obs (Z-type), so a single-sector IS DEM would be blind to the sector that flips
# the memory observables and silently undercount F_mem. (Default is single-sector.)
mw_single_sector: false

# interleaved mass ends near w~1100; the 1674 top is inherited from the serialized
# model — the tail bins past ~1150 are saturated and cost deep600 time, but the
# 3-zero-bin early stop only fires descending, so cap kept honest at 1200.
weights_range: [1, 1200]
adaptive: true
adaptive_failures: 20
adaptive_shots_min: 4
adaptive_shots_max: 3000
adaptive_stop_zero_bins: 3
