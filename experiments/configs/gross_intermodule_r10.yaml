# Wave 6: gross-to-gross INTER-MODULE joint X̄₁(A)⊗X̄₁(B) — r=10 sibling of gross_intermodule_r1.yaml.
# l-coupler / Bell-pair rate p_coupler = 10 * p_ref: the paper's flagged "Bell-couplers may be an
# order of magnitude worse than gates" case (Tour de Gross future-work note). Compare against the r=1
# baseline to read off Bell-pair-fidelity sensitivity. See gross_intermodule_r1.yaml for full notes.
label: gross_intermodule_r10
code_name: bb144
experiment: inter_module
decoder_name: relay
techniques: [IS, I]

p_ref: 0.005
p_lo: 1.0e-4
p_hi: 0.005
p_coupler_factor: 10
lpu_C: 10
lpu_d_init: 12
lpu_idle_noise: true
lpu_include_memory_obs: false
ansatz_model: f5
pin_onset: false

relay_num_sets: 20
relay_stop_nconv: 5

mw_single_sector: false
mw_use_symmetry: false
mw_max_trials: 500
mw_workers: 16

weights_range: [1, 1742]    # FROZEN 2026-07-27 from the idle-ON sizing probe at the production
                            # geometry (C=10, d_init=12, idle_noise=true, p_coupler_factor=10):
                            # N_expanded=4737210, q_base=3.34e-4 -> mu(1e-4)=31.7, mu(5e-3)=1582.8,
                            # w_hi = ceil(mu_max + 4*sqrt(mu_max)) = 1742. Higher than the r=1 leg's
                            # 1674, as expected: r=10 adds coupler mass. The old [1,900] PLACEHOLDER
                            # stopped short of the p_hi mass at w~1583.
weight_stride: 6
adaptive: true
adaptive_failures: 20
adaptive_shots_min: 4
adaptive_shots_max: 3000
adaptive_stop_zero_bins: 3
