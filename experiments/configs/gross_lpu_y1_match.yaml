# Fail-fast Table-4 MATCH config for the Y1 in-module measurement (2026-08-20).
# Reverse-engineered against the paper's Table-1 fingerprint for BB(12)-circuit-Y1
# (N=79,591 compressed / M=2,144 / expanded ratio 5.03):
#   C=6, d_init=3  -> 79,470 compressed (0.15% off), 2,264 detectors (+120,
#                     boundary-convention residual; our layering is module-style,
#                     not the paper's 12-timestep graph coloring — exact match
#                     impossible by construction, see the builder docstring)
#   lpu_interleaved_idle_depth: -1 -> FLAT per-round idle (one DEPOLARIZE1(p) per
#                     pool qubit per round; targets the paper's mult~5 fingerprint
#                     vs our serialized model's 17-24)
# KNOWN GAP: our K=12 minimal framing (obs 0 = outcome, 1..11 = memory) vs the
# paper's K=24 Bell-pair harness — total failure fractions are convention-caveated.
# Target bin (paper Table 4): w=100 -> F/T = 94/1826 = 5.15e-2, delineated
# F_mem=72, F_out=38, F_both=16.
label: gross_lpu_y1_match
outdir: runs/framework/bb144/y1_match
code_name: bb144
experiment: joint_pauli
decoder_name: relay
techniques: [IS, I]

p_ref: 0.005
p_lo: 1.0e-4
p_hi: 0.005
lpu_operators: Y1
lpu_C: 6
lpu_d_init: 3
lpu_idle_noise: true
lpu_interleaved_idle_depth: -1
lpu_include_memory_obs: true
ansatz_model: f5
pin_onset: false

relay_num_sets: 20
relay_stop_nconv: 5

mw_single_sector: false
mw_use_symmetry: false
mw_max_trials: 400
mw_workers: 6
mw_systematic: true

weights_range: [1, 600]
adaptive: true
adaptive_failures: 20
adaptive_shots_min: 4
adaptive_shots_max: 3000
adaptive_stop_zero_bins: 3
