# Technique II PROBE for the merged inter-module circuit (2026-08-19, E1-lite).
# The full-circuit search (d_init=12, C=10; 418k mechs) OOMs a 31GB box in phase II.1.
# This probe shrinks the circuit at the source — d_init=1, C=2 keeps the complete
# merged-code structure (bridge, Bell checks, U_B cross checks, edge init/readout)
# in a ~10x smaller DEM. CAVEAT: unlike the bb288 fault-restriction, this is not a
# certified restriction — a light logical found here is a CANDIDATE whose support
# must be re-verified on the full circuit (cheap: one syndrome XOR); a null result
# here does not certify the full circuit. Target from the paper (arXiv:2506.03094
# §2.4): deformed code distance d-1=11, onset 6 errors. Anything materially lighter
# is the construction bug — check its support against the bridge/triangle region
# (the 11th intra-module U_B cycle has no cross-module counterpart in our adapter).
label: gross_intermodule_mw_probe
outdir: runs/framework/bb144/inter_module_mw_probe
code_name: bb144
experiment: inter_module
decoder_name: relay
techniques: [II]

p_ref: 0.005
p_lo: 1.0e-4
p_hi: 0.005
p_coupler_factor: 1
lpu_C: 2
lpu_d_init: 1
lpu_idle_noise: true
lpu_include_memory_obs: false
ansatz_model: f5
pin_onset: false

relay_num_sets: 20
relay_stop_nconv: 5

mw_single_sector: false
mw_use_symmetry: false
mw_max_trials: 600
mw_workers: 6
mw_systematic: true

weights_range: [1, 400]
adaptive: true
adaptive_failures: 20
adaptive_shots_min: 4
adaptive_shots_max: 3000
adaptive_stop_zero_bins: 3
